name = "recordatorios-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Revisa los avisos cada minuto
[triggers]
crons = ["* * * * *"]

[vars]
TIMEZONE = "Europe/Madrid"
# Hora a la que suenan los recordatorios de día completo (y "posponer a mañana")
ALL_DAY_HOUR = "9"
# Duración de los eventos con hora que crea el bot (minutos)
EVENT_DURATION_MIN = "30"
# IA para entender texto libre: "workers-ai" (gratis, incluida en Cloudflare)
# o "anthropic" (Claude Haiku; necesita el secreto ANTHROPIC_API_KEY)
AI_PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
CLAUDE_MODEL = "claude-haiku-5-5"
# Cuánto "piensa" Claude; déjalo vacío ("") para usar el valor por defecto
CLAUDE_EFFORT = "low"

# Workers AI (plan gratuito: 10.000 neuronas al día)
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "recordatorios"
database_id = "fb164d22-d700-48ed-a997-3f2fe42bbb3c"

[observability]
enabled = true

# Secretos (se configuran con `npx wrangler secret put NOMBRE`, nunca aquí):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ALLOWED_CHAT_ID,
#   CALENDAR_ID, GOOGLE_SERVICE_ACCOUNT, ANTHROPIC_API_KEY
